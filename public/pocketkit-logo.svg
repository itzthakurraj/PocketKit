<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" fill="none">
  <defs>
    <linearGradient id="pkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="sparklePk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="pkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(16, 16)">
    <rect width="128" height="128" rx="32" fill="url(#pkGrad)" />
    
    <!-- Tools rising -->
    <path d="M48 30 L55 30 L58 55 L45 55 Z" fill="#FFFFFF" />
    <polygon points="48,30 51.5,20 55,30" fill="url(#sparklePk)" />
    <path d="M35 45 C32 38, 38 30, 45 32 L50 48 L40 58 Z" fill="#F8FAFC" opacity="0.9" />

    <!-- Pocket Crest -->
    <path d="M34 56 L94 56 L94 80 C94 98, 78 112, 64 117 C50 112, 34 98, 34 80 Z" fill="#FFFFFF" filter="url(#pkShadow)" />
    <path d="M34 56 L94 56 L94 65 L34 65 Z" fill="#F1F5F9" />
    <path d="M40 70 L88 70 L88 80 C88 94, 75 105, 64 109 C53 105, 40 94, 40 80 Z" fill="url(#pkGrad)" />
    
    <!-- Monogram P -->
    <path d="M58 78 L58 101 M58 78 L66 78 C70 78, 73 81, 73 85 C73 89, 70 92, 66 92 L58 92" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sparkle -->
    <path d="M98 25 L100 32 L107 34 L100 36 L98 43 L96 36 L89 34 L96 32 Z" fill="url(#sparklePk)" />
  </g>

  <!-- Wordmark Text -->
  <text x="168" y="96" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#1E293B">Pocket<tspan fill="url(#pkGrad)">Kit</tspan></text>
  
  <!-- Slogan / Subtitle -->
  <text x="170" y="126" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#64748B">ALL-IN-ONE DIGITAL WORKSHOP</text>
  
  <!-- Pill Badge -->
  <g transform="translate(450, 44)">
    <rect width="64" height="24" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
    <text x="32" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#4F46E5" text-anchor="middle">v2.0 PRO</text>
  </g>
</svg>
